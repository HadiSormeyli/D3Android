<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Zoomable Treemap</title>
    <script src="d3.v5.min.js"></script>
    <style>
        @font-face {
            font-family: 'DanaFa';
            src: url('file:///android_asset/dana_fa_medium.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            margin: 0;
            font-family: 'DanaFa';
            overflow: hidden;
        }
    </style>
</head>

<body>
<svg width="100%" height="100%"></svg>

<script>
    const margin = { top: 0, right: 0, bottom: 0, left: 0 };
    const width = window.innerWidth - margin.left - margin.right;
    const height = window.innerHeight - margin.top - margin.bottom;

    const outerSvg = d3.select("svg")
        .attr("width", width)
        .attr("height", height);

    const zoomLayer = outerSvg.append("g");

    let currentRoot = null;
    let historyStack = [];
    let currentScale = 1;
    let allData = []
    let colorParser = {
        headerColor: "#4A4D57",
        colorRanges: [
            { min: -Infinity, max: -3, color: "#F71E3C" },
            { min: -3, max: -1, color: "#B53849" },
            { min: -1, max: 1, color: "#414554" },
            { min: 1, max: 3, color: "#318F54" },
            { min: 3, max: Infinity, color: "#26C963" }
        ]
    };

    function containsCurrentRootName(root) {
            if (!currentRoot) {
                return root;
            }

            if (root.data.name === currentRoot.data.name) {
                return root;
            }

            if (root.children) {
                for (let child of root.children) {
                    if (child.data.name == currentRoot.data.name) {
                        return child;
                    }
                }
            }
            return root;
     }

    function setData(data, newColorParser = colorParser) {
        colorParser = newColorParser;
        allData = data;
        const root = d3.hierarchy(data)
            .sum(d => d.value)
            .sort((a, b) => b.value - a.value);

        currentRoot = containsCurrentRootName(root)
        drawTreemap(currentRoot);
    }

    function isInRange(value, min, max, rangeType) {
      switch (rangeType) {
        case 'INCLUSIVE_INCLUSIVE':
          return value >= min && value <= max;
        case 'EXCLUSIVE_INCLUSIVE':
          return value > min && value <= max;
        case 'EXCLUSIVE_EXCLUSIVE':
          return value > min && value < max;
        default:
         return value >= min && value < max;
      }
    }

    function getColorForValue(colorValue) {
      const match = colorParser.colorRanges.find(range =>
        isInRange(colorValue, range.min, range.max, range.rangeType)
      );


      return match ? match.color : colorParser.colorRanges[0].color;
    }

    function textFits(d, scale = 1) {
        const boxWidth = (d.x1 - d.x0) * scale;
        const boxHeight = (d.y1 - d.y0) * scale;
        const avgCharWidth = 8;
        const lineHeight = 14;
        const textLines = 2;

        const maxLineLength = Math.max(
            d.data.name.length * avgCharWidth,
            String(d.labelValue).length * avgCharWidth
        );

        return maxLineLength <= boxWidth && (lineHeight * textLines) <= boxHeight;
    }

    function drawTreemap(rootNode) {
        zoomLayer.selectAll("*").remove();

        const treemap = d3.treemap()
            .size([width, height])
            .paddingTop(24)
            .round(false)
            .tile(d3.treemapSquarify.ratio(1.2));

        const rootCopy = d3.hierarchy(rootNode.data ? rootNode.data : rootNode)
            .sum(d => d.value)
            .sort((a, b) => b.value - a.value);

        treemap(rootCopy);

        const allNodes = zoomLayer.selectAll(".node")
            .data(rootCopy.descendants())
            .enter()
            .append("g")
            .attr("class", "node")
            .attr("transform", d => `translate(${d.x0}, ${d.y0})`);

        allNodes.append("rect")
            .style("stroke", d => d.children ? "#888" : "#4A4D57")
            .style("stroke-width", d => d.children ? 0.25 : 0.5)
            .attr("width", d => d.x1 - d.x0)
            .attr("height", d => d.y1 - d.y0);

        allNodes.filter(d => !d.children)
             .style("fill", d => getColorForValue(d.data.colorValue))
             .append("g")
            .append("text")
            .attr("class", "items")
            .style("display", d => `${textFits(d, currentScale) ? null : "none"}`)
            .attr("fill", "white")
            .style("font-size", d => `${0.75 / currentScale}em`)
            .attr("x", d => (d.x1 - d.x0) / 2)
            .attr("y", d => (d.y1 - d.y0) / 2)
            .attr("text-anchor", "middle")
            .append("tspan")
            .text(d => d.data.name)
            .attr("dy", "-0.5em")
            .attr("x", d => (d.x1 - d.x0) / 2)
            .append("tspan")
            .text(d => `\u200E${+d.data.labelValue}`)
            .attr("dy", "1.2em")
            .attr("x", d => (d.x1 - d.x0) / 2);

        allNodes.filter(d => d.children)
            .style("fill", d => colorParser.headerColor)
            .on("click", function (d) {
                if (d.data !== currentRoot.data) {
                    historyStack.push(currentRoot.data.name);
                    currentRoot = d;
                    outerSvg.call(zoom.transform, d3.zoomIdentity);
                    currentScale = 1;
                    drawTreemap(d);

                }
            })
            .append("svg")
            .attr("width", d => d.x1 - d.x0)
            .attr("height", 24)
            .attr("fill", "white")
            .append("text")
            .attr("class", "items")
            .attr("text-anchor", "middle")
            .attr("x", d => (d.x1 - d.x0) / 2)
            .attr("y", 12)
            .style("overflows", "hidden")
            .style("white-space", "nowrap")
            .attr("dominant-baseline", "middle")
            .style("font-size", d => `${0.75 / currentScale}em`)
            .text(d => d.data.name);
    }

    function findNodeByName(name, node = allData) {
        if (node.name === name) return node;
        if (!node.children) return null;

        for (let child of node.children) {
            const found = findNodeByName(name, child);
            if (found) return found;
        }
        return null;
    }

    function isInView(d, transform) {
        const x = d.x0 * transform.k + transform.x;
        const y = d.y0 * transform.k + transform.y;
        const width = (d.x1 - d.x0) * transform.k;
        const height = (d.y1 - d.y0) * transform.k;

        return (
            x + width > 0 &&
            y + height > 0 &&
            x < window.innerWidth &&
            y < window.innerHeight
        );
    }

    function updateTextVisibility(transform) {
        zoomLayer.selectAll(".items")
            .each(function (d) {
                const label = d3.select(this);
                const fits = textFits(d, transform.k);
                const inView = isInView(d, transform);
                label
                    .style("font-size", `${0.75 / transform.k}em`)
                    .style("display", (!d.children) ? ((fits && inView) ? null : "none") : null);
            });
    }

    function onBackPressed() {
        if (historyStack.length > 0) {
            const lastName = historyStack.pop();
            let nodeData = findNodeByName(lastName);

            if (!nodeData) {
                nodeData = allData;
            }

            const nodeHierarchy = d3.hierarchy(nodeData)
                .sum(d => d.value)
                .sort((a, b) => b.value - a.value);

            currentRoot = nodeHierarchy;
            drawTreemap(nodeHierarchy);

            outerSvg.call(zoom.transform, d3.zoomIdentity);

            return true;
        }
        return false;
    }

    const zoom = d3.zoom()
        .scaleExtent([1, 100])
        .translateExtent([[0, 0], [width, height]])
        .on("zoom", function () {
            const event = d3.event;
            zoomLayer.attr("transform", event.transform);
            currentScale = event.transform.k;
            updateTextVisibility(event.transform);
        });

    function handleMessage(event, port) {
        const message = event.data;
        try {
            const parsed = JSON.parse(message);

            if (parsed.data && parsed.data.fn === "setData") {
                const data = parsed.data.params.data;
                const colors = parsed.data.params.colors;
                setData(data, colors);
            } else if (parsed.data.fn === "onBackPressed") {
                const result = onBackPressed();
                const response = {
                    messageType: "Message::FunctionResult",
                    data: {
                        fn: parsed.data.fn,
                        uuid: parsed.data.uuid,
                        result: result
                    }
                };

                port.postMessage(JSON.stringify(response));
            }
        } catch (e) {
            console.error("Error handling message", e);
        }
    }

    window.addEventListener("message", function (event) {
        if (event.ports && event.ports.length > 0) {
            const port = event.ports[0];
            port.onmessage = (e) => handleMessage(e, port);
            port.start?.();
        }
    });
    outerSvg.call(zoom);
</script>
</body>

</html>
